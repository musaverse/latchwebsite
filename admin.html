<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>Blog Studio · Latch Infinity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,300..700&display=swap">
<style>
:root {
  --paper: #ffffff; --wash: #f6f7f4; --hover: #eef0ea; --ink: #141813; --ink-2: #4a5149; --ink-3: #868c84; --line: #e6e8e1; --line-2: #d6d9d0;
  --deep: #333a32; --mint: #b1f7bb; --tint: #e6f8e8; --lilac: #d8ccff; --tint-lilac: #efeafc; --focus: #1f6b2c; --err: #a33a2e;
  --font: 'Archivo', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1); --shadow: 0 1px 2px rgba(20,24,19,.06), 0 12px 32px rgba(20,24,19,.12);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15.5px/1.55 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { font-weight: 400; font-stretch: 125%; letter-spacing: -.012em; line-height: 1.12; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
svg { flex: none; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid transparent; background: none; font-size: 14.5px; white-space: nowrap; transition: background .15s, border-color .15s, color .15s, opacity .15s; }
.btn:disabled { opacity: .45; cursor: default; }
.btn-primary { background: var(--ink); color: #fff; }
.btn-primary:not(:disabled):hover { background: var(--deep); }
.btn-line { border-color: var(--line-2); }
.btn-line:hover { border-color: var(--ink-3); }
.btn-quiet:hover { background: var(--hover); }
.icon-btn { width: 40px; height: 40px; display: inline-grid; place-items: center; border: 0; border-radius: 999px; background: none; color: var(--ink-2); transition: background .15s, color .15s; }
.icon-btn:hover, .icon-btn[aria-expanded="true"] { background: var(--hover); color: var(--ink); }

/* ---------- Top bar ---------- */
.top { position: sticky; top: 0; z-index: 30; height: 64px; display: flex; align-items: center; gap: 6px; padding: 0 max(12px, env(safe-area-inset-left)) 0 max(12px, env(safe-area-inset-left)); background: rgba(255,255,255,.9); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid transparent; transition: border-color .2s; }
.top.lined { border-bottom-color: var(--line); }
.top .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; height: 40px; border-radius: 999px; }
.top .brand b { font-weight: 400; font-stretch: 125%; font-size: 16px; }
.top .grow { flex: 1; min-width: 0; }
.status { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-3); min-width: 0; padding-left: 4px; }
.status span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex: none; }
.dot.live { background: #2f9e44; }
.dot.draft { background: #9b87e8; }
.dot.busy { background: #c9a24b; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--wash); display: grid; place-items: center; }

/* ---------- Menu ---------- */
.menu { position: fixed; z-index: 60; min-width: 220px; padding: 6px; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); display: grid; animation: pop .16s var(--ease); }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.menu button, .menu a { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border: 0; border-radius: 9px; background: none; text-align: left; font-size: 14.5px; color: var(--ink); }
.menu button:hover, .menu a:hover, .menu .on { background: var(--hover); }
.menu .danger { color: var(--err); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
.menu small { color: var(--ink-3); font-size: 12.5px; margin-left: auto; padding-left: 16px; }
.menu .ic { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; color: var(--ink-2); font-size: 13px; font-weight: 600; }
.menu .lab { display: grid; line-height: 1.25; }
.menu .lab i { font-style: normal; color: var(--ink-3); font-size: 12.5px; }

/* ---------- Library ---------- */
.lib { max-width: 1180px; margin: 0 auto; padding: clamp(24px, 4vw, 48px) max(20px, env(safe-area-inset-left)) 96px; }
.lib-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
.lib-head h1 { font-size: clamp(30px, 4vw, 48px); }
.lib-head p { color: var(--ink-3); margin-top: 8px; }
.filters { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
.seg { display: inline-flex; padding: 3px; background: var(--wash); border-radius: 999px; }
.seg button { height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: none; font-size: 14px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(20,24,19,.12); }
.seg i { font-style: normal; color: var(--ink-3); font-size: 12.5px; }
.search { position: relative; margin-left: auto; width: min(280px, 100%); }
.search input { width: 100%; height: 40px; border: 1px solid var(--line); border-radius: 999px; padding: 0 14px 0 38px; background: #fff; outline: none; transition: border-color .15s; }
.search input:focus { border-color: var(--ink-3); }
.search svg { position: absolute; left: 13px; top: 12px; color: var(--ink-3); }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 24px; }
.card { display: grid; gap: 12px; align-content: start; border-radius: 16px; outline-offset: 6px; min-width: 0; }
.card .thumb { position: relative; aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden; background: var(--wash); }
.card .thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s var(--ease); }
.card:hover .thumb img { transform: scale(1.03); }
.card .thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); }
.badge { position: absolute; top: 10px; left: 10px; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,.94); font-size: 12.5px; color: var(--ink-2); }
.card h3 { font-size: 17.5px; font-stretch: 112%; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .sub { font-size: 13.5px; color: var(--ink-3); display: flex; gap: 6px; flex-wrap: wrap; }
.card.new .thumb { border: 1.5px dashed var(--line-2); background: none; display: grid; place-items: center; color: var(--ink-2); transition: border-color .15s, background .15s; }
.card.new:hover .thumb { border-color: var(--ink-3); background: var(--wash); }
.card.new .thumb span { display: grid; justify-items: center; gap: 10px; font-size: 14.5px; }
.card.resume .thumb { outline: 2px solid var(--mint); outline-offset: -2px; }
.empty { grid-column: 1 / -1; padding: 56px 20px; text-align: center; color: var(--ink-3); }
.banner { display: flex; align-items: center; gap: 16px; padding: 16px 18px; border-radius: 16px; background: var(--tint); margin-bottom: 28px; flex-wrap: wrap; }
.banner p { flex: 1; min-width: 220px; color: var(--ink-2); font-size: 14.5px; }
.banner b { color: var(--ink); font-weight: 600; }
@media (max-width: 900px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) {
  .cards { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .search { margin-left: 0; width: 100%; order: -1; }
  .top .brand b { display: none; }
}

/* ---------- Writing canvas ---------- */
.canvas { position: relative; max-width: 760px; margin: 0 auto; padding: clamp(20px, 4vw, 44px) 24px 40vh; }
.cover { position: relative; margin: 0 0 32px; border-radius: 16px; overflow: hidden; }
.cover.has { aspect-ratio: 16 / 9; background: var(--wash); }
.cover.has img { width: 100%; height: 100%; object-fit: cover; }
.cover .tools { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 6px; opacity: 0; transition: opacity .2s; }
.cover:hover .tools, .cover:focus-within .tools, .cover.touch .tools { opacity: 1; }
.cover .tools button { height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: rgba(20,24,19,.78); color: #fff; font-size: 13.5px; backdrop-filter: blur(6px); }
.cover .tools button:hover { background: rgba(20,24,19,.92); }
.cover-add { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 10px; margin-left: -10px; border: 0; border-radius: 999px; background: none; color: var(--ink-3); font-size: 14px; transition: background .15s, color .15s; }
.cover-add:hover { background: var(--hover); color: var(--ink); }
.cover.over { outline: 2px dashed var(--focus); outline-offset: 4px; }
.drop-zone { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: rgba(230,248,232,.9); font-size: 18px; color: var(--deep); pointer-events: none; }
.t-title, .t-sum { display: block; width: 100%; border: 0; outline: none; resize: none; background: none; padding: 0; overflow: hidden; }
.t-title { font-weight: 400; font-stretch: 125%; font-size: clamp(30px, 4.6vw, 44px); line-height: 1.1; letter-spacing: -.015em; }
.t-sum { margin-top: 14px; font-size: clamp(18px, 2vw, 20px); line-height: 1.5; color: var(--ink-2); }
.t-title::placeholder, .t-sum::placeholder { color: #b9beb5; }
.byline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 20px 0 8px; font-size: 13.5px; color: var(--ink-3); }
.byline button { height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: none; font-size: 13.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.byline button:hover { border-color: var(--ink-3); color: var(--ink); }
.byline .missing { border-style: dashed; }
.rule { height: 1px; background: var(--line); margin: 20px 0 32px; }

/* The article body is styled like the published page, so what you see is what readers get. */
.prose { outline: none; font-size: 18px; line-height: 1.75; color: #262b25; caret-color: var(--focus); overflow-wrap: anywhere; min-height: 40vh; }
.prose > * { margin: 0; }
.prose > * + * { margin-top: 1.05em; }
.prose h2 { font-size: clamp(24px, 2.8vw, 30px); line-height: 1.18; margin-top: 1.9em; color: var(--ink); }
.prose h3 { font-size: clamp(19px, 2vw, 22px); line-height: 1.3; margin-top: 1.6em; color: var(--ink); }
.prose h4 { font-size: 17px; font-weight: 600; }
.prose h2 + *, .prose h3 + * { margin-top: .55em; }
.prose > :first-child { margin-top: 0; }
.prose ul, .prose ol { padding-left: 1.4em; display: grid; gap: .35em; }
.prose ul { list-style: none; padding-left: 0; }
.prose ul > li { position: relative; padding-left: 1.5em; }
.prose ul > li::before { content: ""; position: absolute; left: 0; top: .82em; width: 12px; height: 2px; background: var(--deep); transform: skewX(-33deg); }
.prose ol > li::marker { color: var(--ink-3); }
.prose a { color: var(--focus); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(31,107,44,.4); }
.prose blockquote { padding: 2px 0 2px 22px; border-left: 3px solid var(--mint); font-size: 1.1em; color: var(--ink); }
.prose blockquote p { margin: 0; }
.prose hr { border: 0; height: 28px; position: relative; margin: 1.6em 0; }
.prose hr::after { content: "· · ·"; position: absolute; inset: 0; text-align: center; color: var(--ink-3); letter-spacing: .6em; line-height: 28px; }
.prose code { background: var(--wash); padding: 1px 6px; border-radius: 6px; font-size: .88em; }
.prose figure { position: relative; margin: 1.8em 0; user-select: none; }
.prose figure img { width: 100%; border-radius: 12px; }
.prose figure.sel img { outline: 3px solid var(--mint); outline-offset: 3px; }
.prose figcaption { margin-top: 10px; font-size: 14px; color: var(--ink-3); text-align: center; outline: none; user-select: text; min-height: 1.5em; }
.prose figcaption:empty::before { content: attr(data-ph); color: #b9beb5; }
.prose .fig-x { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: rgba(20,24,19,.78); color: #fff; display: grid; place-items: center; opacity: 0; transition: opacity .15s; }
.prose figure:hover .fig-x, .prose figure.sel .fig-x, .prose figure:focus-within .fig-x { opacity: 1; }
.prose.empty > p:first-child::before { content: attr(data-ph); color: #b9beb5; position: absolute; pointer-events: none; }
.prose p.hint::before { content: "Type / for headings, lists, images…"; color: #c4c8c0; position: absolute; pointer-events: none; }
.ending { margin-top: 56px; padding: 22px 24px; border-radius: 16px; background: var(--tint); display: grid; gap: 8px; }
.ending .lab { font-stretch: 75%; letter-spacing: .1em; text-transform: uppercase; font-size: 12px; color: var(--deep); }
.ending textarea { border: 0; background: none; outline: none; resize: none; width: 100%; font-size: 16.5px; line-height: 1.6; padding: 0; overflow: hidden; }
.ending textarea::placeholder { color: #8fa391; }

/* Floating tools */
.plus { position: absolute; z-index: 5; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line-2); background: #fff; color: var(--ink-3); display: grid; place-items: center; transition: transform .2s var(--ease), color .15s, border-color .15s, opacity .15s; }
.plus:hover, .plus[aria-expanded="true"] { color: var(--ink); border-color: var(--ink-3); }
.plus[aria-expanded="true"] { transform: rotate(45deg); }
.bubble { position: fixed; z-index: 50; display: flex; align-items: center; gap: 2px; padding: 4px; background: var(--ink); color: #fff; border-radius: 12px; box-shadow: var(--shadow); animation: pop .14s var(--ease); }
.bubble button { min-width: 34px; height: 34px; padding: 0 8px; border: 0; border-radius: 8px; background: none; color: rgba(255,255,255,.82); display: grid; place-items: center; font-size: 14px; }
.bubble button:hover { background: rgba(255,255,255,.12); color: #fff; }
.bubble button.on { color: var(--mint); }
.bubble .sep { width: 1px; height: 20px; background: rgba(255,255,255,.18); margin: 0 3px; }
.bubble input { width: min(280px, 64vw); height: 34px; border: 0; outline: none; background: none; color: #fff; padding: 0 8px; font-size: 14px; }
.bubble input::placeholder { color: rgba(255,255,255,.5); }

/* ---------- Sheet (details / publish) ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(20,24,19,.28); animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: fixed; z-index: 45; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: #fff; box-shadow: -20px 0 60px rgba(20,24,19,.14); display: flex; flex-direction: column; animation: slide .32s var(--ease); }
@keyframes slide { from { transform: translateX(100%); } }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px 14px 14px 24px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: 21px; flex: 1; }
.sheet-body { flex: 1; overflow: auto; padding: 24px; display: grid; gap: 26px; align-content: start; overscroll-behavior: contain; }
.sheet-foot { padding: 14px 24px max(14px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; }
.sheet-foot .btn-primary { flex: 1; height: 46px; font-size: 15.5px; }
.fld { display: grid; gap: 10px; }
.fld > label, .fld > .lb { font-size: 13px; font-weight: 600; color: var(--ink); display: flex; justify-content: space-between; gap: 10px; }
.fld > label i, .fld > .lb i { font-style: normal; font-weight: 400; color: var(--ink-3); }
.fld small { color: var(--ink-3); font-size: 12.5px; line-height: 1.45; }
.inp { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; background: #fff; outline: none; transition: border-color .15s, box-shadow .15s; }
textarea.inp { height: auto; padding: 11px 14px; resize: vertical; line-height: 1.5; }
.inp:focus, .url:focus-within, .tokens:focus-within { border-color: var(--ink-3); box-shadow: 0 0 0 4px var(--wash); }
.url { display: flex; align-items: center; height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; transition: border-color .15s, box-shadow .15s; }
.url span { color: var(--ink-3); white-space: nowrap; font-size: 14px; }
.url input { border: 0; outline: none; flex: 1; min-width: 0; background: none; padding: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font-size: 14px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; transition: all .15s; }
.chip:hover { border-color: var(--ink-3); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip.add { border-style: dashed; }
.chip input { border: 0; outline: none; background: none; width: 140px; padding: 0; }
.tokens { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; transition: border-color .15s, box-shadow .15s; cursor: text; }
.tok { display: inline-flex; align-items: center; gap: 2px; height: 30px; padding: 0 4px 0 12px; border-radius: 999px; background: var(--wash); font-size: 13.5px; }
.tok button { width: 24px; height: 24px; border: 0; border-radius: 50%; background: none; display: grid; place-items: center; color: var(--ink-3); }
.tok button:hover { background: var(--hover); color: var(--ink); }
.tokens input { flex: 1; min-width: 120px; border: 0; outline: none; background: none; height: 30px; padding: 0 6px; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; }
.sugg button { height: 28px; padding: 0 10px; border: 0; border-radius: 999px; background: none; color: var(--ink-3); font-size: 13px; }
.sugg button:hover { background: var(--wash); color: var(--ink); }
.checks { display: grid; gap: 2px; padding: 6px; background: var(--wash); border-radius: 14px; }
.check { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border: 0; background: none; border-radius: 10px; text-align: left; font-size: 14.5px; width: 100%; }
button.check:hover { background: var(--hover); }
.check .st { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.check.ok .st { background: var(--deep); color: var(--mint); }
.check.no .st { border: 1.5px dashed var(--ink-3); }
.check.opt .st { border: 1.5px solid var(--line-2); }
.check span { flex: 1; }
.check i { font-style: normal; color: var(--ink-3); font-size: 13px; }
.check.no i { color: var(--err); }
@media (max-width: 560px) {
  .sheet { top: auto; height: min(92vh, 92dvh); width: 100vw; border-radius: 20px 20px 0 0; animation-name: up; }
  @keyframes up { from { transform: translateY(100%); } }
  .sheet-head::before { content: ""; position: absolute; left: 50%; top: 6px; width: 36px; height: 4px; border-radius: 4px; background: var(--line-2); transform: translateX(-50%); }
  .canvas { padding-left: 20px; padding-right: 20px; }
  .prose { font-size: 17px; }
}

/* ---------- Dialog, toast ---------- */
dialog { border: 0; border-radius: 20px; padding: 0; width: min(460px, calc(100vw - 32px)); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(20,24,19,.4); }
.dlg { padding: 26px; display: grid; gap: 16px; }
.dlg h2 { font-size: 22px; }
.dlg p { color: var(--ink-2); }
.dlg .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.btn-danger { background: var(--err); color: #fff; }
.steps { display: grid; gap: 14px; counter-reset: s; margin: 4px 0; padding: 0; list-style: none; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 12px; font-size: 14.5px; color: var(--ink-2); }
.steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--wash); display: grid; place-items: center; font-size: 13px; color: var(--ink); font-weight: 600; }
.steps b { color: var(--ink); font-weight: 600; }
.steps a { color: var(--focus); text-decoration: underline; text-underline-offset: 3px; }
.err-msg { color: var(--err); font-size: 13.5px; }
.toast { position: fixed; z-index: 80; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 14px; max-width: calc(100vw - 32px); padding: 12px 14px 12px 18px; border-radius: 14px; background: var(--ink); color: #fff; font-size: 14.5px; box-shadow: var(--shadow); animation: toast .3s var(--ease); }
@keyframes toast { from { opacity: 0; transform: translate(-50%, 12px); } }
.toast.err { background: var(--err); }
.toast a, .toast button { color: var(--mint); background: none; border: 0; padding: 4px 6px; font-weight: 600; white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="pick" accept="image/*" hidden>
<dialog id="dlg"></dialog>

<script src="blog/md.js"></script>
<script>
(() => {
'use strict';
const { render, esc, slugify, words } = LatchMD;
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const store = {
  get(k, d) { try { const v = localStorage.getItem('latchblog.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('latchblog.' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem('latchblog.' + k); } catch (e) {} },
};

/* ---------- icons (one stroke weight) ---------- */
const ic = (d, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  back: ic('<path d="M15 18l-6-6 6-6"/>'), plus: ic('<path d="M12 5v14M5 12h14"/>'), more: ic('<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>'),
  sliders: ic('<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>'), x: ic('<path d="M6 6l12 12M18 6L6 18"/>'),
  search: ic('<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/>', 16), image: ic('<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M20 16l-5-5-8 8"/>'),
  check: ic('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 14), ext: ic('<path d="M14 5h5v5M19 5l-8 8M18 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4"/>', 16),
  trash: ic('<path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/>', 16), draft: ic('<path d="M4 20h4L19 9l-4-4L4 16v4z"/>', 16), undo: ic('<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>', 16),
  link: ic('<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>', 16),
  quote: ic('<path d="M7 17c-2 0-3-1.5-3-3.5C4 10 6 7.5 9 7M17 17c-2 0-3-1.5-3-3.5 0-3.5 2-6 5-6.5"/>', 16), key: ic('<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/>', 16),
  logo: '<svg width="20" height="28" viewBox="8 4 298 410" aria-hidden="true"><g fill="none" stroke="#333A32" stroke-width="30"><path d="M220.6 128.8A72 72 0 1 0 96.6 134.2L168 254"/><path d="M93.4 225.2A72 72 0 1 0 217.4 219.8L140.2 101"/></g></svg>',
};

/* ---------- state ---------- */
const cfg = Object.assign({ repo: 'musaverse/latchwebsite', branch: 'main', token: '' }, store.get('cfg', {}));
const DATA = 'blog/posts.json';
let data = { categories: [], posts: [] }, online = false, pending = {}, ed = null, busy = false, filter = 'all', query = '';

const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ''); return m ? new Date(+m[1], m[2] - 1, +m[3]).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : ''; };
const b64 = s => { const b = new TextEncoder().encode(s); let o = ''; for (let i = 0; i < b.length; i += 0x8000) o += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(o); };
const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));
const byDate = l => [...l].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
const src = p => pending[p] ? pending[p].url : p;
const cats = () => [...new Set([...(data.categories || []), ...data.posts.map(p => p.category)].filter(Boolean))];

function toast(html, opt = {}) {
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast' + (opt.err ? ' err' : ''); t.setAttribute('role', opt.err ? 'alert' : 'status');
  t.innerHTML = `<span>${html}</span>`;
  if (opt.action) { const b = document.createElement('button'); b.textContent = opt.action[0]; b.onclick = () => { t.remove(); opt.action[1](); }; t.append(b); }
  document.body.append(t); setTimeout(() => t.remove(), opt.ms || 4000);
}
/* A small promise-based dialog for confirmations. */
function ask({ title, text, ok = 'OK', cancel = 'Cancel', danger }) {
  const d = $('#dlg');
  d.innerHTML = `<form method="dialog" class="dlg"><h2>${title}</h2>${text ? `<p>${text}</p>` : ''}<div class="acts"><button class="btn btn-line" value="no">${cancel}</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" value="yes" autofocus>${ok}</button></div></form>`;
  d.showModal();
  return new Promise(r => d.addEventListener('close', () => r(d.returnValue === 'yes'), { once: true }));
}

/* ---------- GitHub ---------- */
async function gh(path, opts = {}) {
  const r = await fetch(`https://api.github.com/repos/${cfg.repo}${path}`, { ...opts, cache: 'no-store',
    headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${cfg.token}`, 'X-GitHub-Api-Version': '2022-11-28', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
  if (!r.ok) {
    let m = ''; try { m = (await r.json()).message; } catch (e) {}
    throw new Error(r.status === 401 ? 'GitHub refused the key. It may have expired.' : r.status === 403 || r.status === 404 ? 'This key cannot change the website. It needs Contents: Read and write.' : r.status === 409 || r.status === 422 ? 'Someone published at the same moment. Try again.' : m || `GitHub returned ${r.status}.`);
  }
  return r.status === 204 ? null : r.json();
}
async function readRemote(ref) {
  const f = await gh(`/contents/${DATA}?ref=${encodeURIComponent(ref)}`);
  return JSON.parse(f.content ? unb64(f.content) : unb64((await gh(`/git/blobs/${f.sha}`)).content));
}
/* One commit carries any new images and posts.json. The change is replayed on the newest posts.json,
   so an edit made by someone else in the meantime is kept. */
async function commit(change, message) {
  const head = (await gh(`/git/ref/heads/${encodeURIComponent(cfg.branch)}`)).object.sha;
  const base = await gh(`/git/commits/${head}`);
  const next = change(structuredClone(await readRemote(head)));
  const json = JSON.stringify(next, null, 2) + '\n', tree = [];
  for (const [path, img] of Object.entries(pending)) {
    if (!json.includes(path)) continue;
    const blob = await gh('/git/blobs', { method: 'POST', body: JSON.stringify({ content: img.b64, encoding: 'base64' }) });
    tree.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
  }
  tree.push({ path: DATA, mode: '100644', type: 'blob', content: json });
  const t = await gh('/git/trees', { method: 'POST', body: JSON.stringify({ base_tree: base.tree.sha, tree }) });
  const c = await gh('/git/commits', { method: 'POST', body: JSON.stringify({ message, tree: t.sha, parents: [head] }) });
  await gh(`/git/refs/heads/${encodeURIComponent(cfg.branch)}`, { method: 'PATCH', body: JSON.stringify({ sha: c.sha }) });
  data = next;
  for (const p of Object.keys(pending)) if (json.includes(p)) delete pending[p];
}
async function load() {
  try {
    if (cfg.token) { data = await readRemote(cfg.branch); online = true; }
    else throw 0;
  } catch (e) {
    if (e && e.message) toast(esc(e.message), { err: true, ms: 7000 });
    online = false;
    try { data = await (await fetch(DATA, { cache: 'no-cache' })).json(); } catch (x) { toast('Could not load the articles.', { err: true }); }
  }
  data.posts = data.posts || []; data.categories = data.categories || [];
}

/* ---------- local copies: everything you type is kept on this device until it is published ---------- */
const localKey = orig => 'local:' + (orig || 'new');
const locals = () => { const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('latchblog.local:')) { const v = store.get(k.slice(10)); if (v && v.post) out.push(v); } } } catch (e) {} return out; };

/* ---------- routing ---------- */
function route() {
  closeFloating();
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === 'new') return openEditor(null);
  if (h.startsWith('edit/')) return openEditor(h.slice(5));
  ed = null; library();
}
addEventListener('hashchange', () => { flushLocal(); route(); });
addEventListener('pagehide', flushLocal);
document.addEventListener('visibilitychange', () => document.hidden && flushLocal());

/* =========================================================================================
   Library
   ========================================================================================= */
function topbar(inner) { return `<header class="top" id="top">${inner}</header>`; }
function library() {
  document.title = 'Blog Studio · Latch Infinity';
  const all = byDate(data.posts), live = all.filter(p => !p.draft), drafts = all.filter(p => p.draft);
  const resume = locals();
  $('#app').innerHTML = `
  ${topbar(`<a class="brand" href="#">${I.logo}<b>Blog Studio</b></a><span class="grow"></span>
    <a class="btn btn-quiet" href="index.html#blog" target="_blank" rel="noopener">View blog ${I.ext}</a>
    ${online ? `<button class="btn btn-quiet" type="button" id="b-acct" aria-haspopup="menu" aria-expanded="false"><span class="dot live"></span>Connected</button>` : ''}`)}
  <main class="lib">
    ${online ? '' : `<div class="banner"><p><b>Connect once to publish.</b> You can write now; publishing needs a key from GitHub. It takes about two minutes.</p><button class="btn btn-primary" type="button" id="b-connect">Connect</button></div>`}
    <div class="lib-head"><div><h1>Articles</h1><p>${live.length} published${drafts.length ? ` · ${drafts.length} draft${drafts.length > 1 ? 's' : ''}` : ''}</p></div>
      <a class="btn btn-primary" href="#new">${I.plus} New article</a></div>
    <div class="filters">
      <div class="seg" role="group" aria-label="Show">${[['all', 'All', all.length], ['live', 'Published', live.length], ['draft', 'Drafts', drafts.length]].map(([k, t, n]) => `<button type="button" data-f="${k}" aria-pressed="${filter === k}">${t}<i>${n}</i></button>`).join('')}</div>
      <label class="search"><span class="sr">Search articles</span>${I.search}<input type="search" id="q" placeholder="Search" value="${esc(query)}"></label>
    </div>
    <div class="cards" id="cards"></div>
  </main>`;
  const draw = () => {
    const s = query.trim().toLowerCase();
    const list = (filter === 'live' ? live : filter === 'draft' ? drafts : all).filter(p => !s || [p.title, p.category, p.excerpt, ...(p.keywords || [])].join(' ').toLowerCase().includes(s));
    const rs = s || filter !== 'all' ? [] : resume.filter(r => !r.orig);
    $('#cards').innerHTML = rs.map(r => card({ ...r.post, _resume: true }, '#new')).join('') +
      list.map(p => card(p, '#edit/' + encodeURIComponent(p.slug), resume.some(r => r.orig === p.slug))).join('') +
      (!list.length && s ? `<p class="empty">Nothing matches “${esc(query)}”.</p>` : !list.length && filter === 'draft' ? '<p class="empty">No drafts. Anything you save as a draft waits here.</p>' : '');
  };
  draw();
  $$('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; $$('[data-f]').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });
  $('#q').oninput = e => { query = e.target.value; draw(); };
  $('#b-connect')?.addEventListener('click', connectDialog);
  const acct = $('#b-acct');
  if (acct) acct.onclick = e => menu(e.currentTarget, [
    ['', `<span class="lab">Publishing to<i>${esc(cfg.repo)}</i></span>`, null],
    ['', 'Disconnect this device', () => { cfg.token = ''; store.set('cfg', cfg); online = false; library(); toast('Disconnected. The key was removed from this device.'); }],
  ]);
  scrollTo(0, 0); scrollLine();
}
function card(p, href, edited) {
  const status = p._resume ? ['busy', 'Not saved yet'] : p.draft ? ['draft', 'Draft'] : ['live', 'Published'];
  return `<a class="card${p._resume ? ' resume' : ''}" href="${href}">
    <div class="thumb">${p.cover ? `<img src="${esc(src(p.cover))}" alt="" loading="lazy">` : `<span class="ph">${I.image}</span>`}<span class="badge"><span class="dot ${status[0]}"></span>${status[1]}${edited ? ' · edited' : ''}</span></div>
    <h3>${esc(p.title || 'Untitled')}</h3>
    <div class="sub"><span>${esc(p.category || 'No category')}</span><span>·</span><span>${fmtDate(p.date)}</span></div></a>`;
}
function scrollLine() { const t = $('#top'); const f = () => t && t.classList.toggle('lined', scrollY > 4); f(); onscroll = f; }

/* ---------- connect ---------- */
function connectDialog() {
  const d = $('#dlg');
  d.innerHTML = `<form class="dlg" id="cf"><h2>Connect to GitHub</h2>
    <p>Publishing saves the article to the website's GitHub repository, which updates the site in about a minute. You only do this once on each device.</p>
    <ol class="steps">
      <li><span>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">New fine-grained token</a> on GitHub.</span></li>
      <li><span>Repository access: <b>Only select repositories</b> › <b>${esc(cfg.repo.split('/')[1] || cfg.repo)}</b>.</span></li>
      <li><span>Permissions › Repository › <b>Contents: Read and write</b>. Generate it and copy it.</span></li>
    </ol>
    <input class="inp" id="c-tok" placeholder="Paste the key here" autocomplete="off" spellcheck="false" aria-label="GitHub key">
    <details><summary style="cursor:pointer;color:var(--ink-3);font-size:13.5px">Repository settings</summary>
      <div style="display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:10px"><input class="inp" id="c-repo" value="${esc(cfg.repo)}" aria-label="Repository"><input class="inp" id="c-br" value="${esc(cfg.branch)}" aria-label="Branch"></div></details>
    <p class="err-msg" id="c-err" hidden></p>
    <p style="font-size:12.5px;color:var(--ink-3)">The key stays on this device and is only sent to GitHub.</p>
    <div class="acts"><button class="btn btn-line" type="button" value="no" id="c-x">Cancel</button><button class="btn btn-primary" id="c-ok">Connect</button></div></form>`;
  d.showModal(); $('#c-tok').focus();
  $('#c-x').onclick = () => d.close();
  $('#cf').onsubmit = async e => {
    e.preventDefault();
    const old = { ...cfg }, err = $('#c-err');
    Object.assign(cfg, { token: $('#c-tok').value.trim(), repo: $('#c-repo').value.trim().replace(/^https:\/\/github\.com\//, '').replace(/\/$/, ''), branch: $('#c-br').value.trim() || 'main' });
    if (!cfg.token) { err.hidden = false; err.textContent = 'Paste the key first.'; return; }
    $('#c-ok').disabled = true; $('#c-ok').textContent = 'Checking…';
    try {
      const r = await gh(''); if (r.permissions && !r.permissions.push) throw new Error('This key can read the website but not change it.');
      data = await readRemote(cfg.branch); online = true; store.set('cfg', cfg); d.close();
      toast('Connected. You can publish now.'); ed ? refreshStatus() : library();
      if (connectDialog.then) { const f = connectDialog.then; connectDialog.then = null; f(); }
    } catch (x) { Object.assign(cfg, old); err.hidden = false; err.textContent = x.message; }
    $('#c-ok').disabled = false; $('#c-ok').textContent = 'Connect';
  };
}

/* ---------- menus ---------- */
function menu(anchor, items) {
  closeFloating();
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  items.filter(Boolean).forEach(it => {
    if (it === '-') { m.append(document.createElement('hr')); return; }
    const [cls, html, fn] = it, b = document.createElement(fn && typeof fn === 'string' ? 'a' : 'button');
    if (typeof fn === 'string') { b.href = fn; b.target = '_blank'; b.rel = 'noopener'; } else b.type = 'button';
    b.className = cls; b.innerHTML = html; b.setAttribute('role', 'menuitem');
    if (!fn) b.disabled = true; else if (typeof fn === 'function') b.onclick = () => { closeFloating(); fn(); };
    m.append(b);
  });
  document.body.append(m);
  const r = anchor.getBoundingClientRect();
  m.style.top = Math.min(r.bottom + 6, innerHeight - m.offsetHeight - 8) + 'px';
  m.style.left = Math.max(8, Math.min(r.right - m.offsetWidth, innerWidth - m.offsetWidth - 8)) + 'px';
  anchor.setAttribute('aria-expanded', 'true'); m._anchor = anchor;
  m.querySelector('button:not(:disabled), a')?.focus();
  m.addEventListener('keydown', e => {
    const b = $$('button:not(:disabled), a', m), i = b.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); b[(i + 1) % b.length].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); b[(i - 1 + b.length) % b.length].focus(); }
    if (e.key === 'Escape') { closeFloating(); anchor.focus(); }
  });
}
function closeFloating() { $$('.menu').forEach(m => { m._anchor?.setAttribute('aria-expanded', 'false'); m.remove(); }); }
document.addEventListener('pointerdown', e => { if (!e.target.closest('.menu, [aria-haspopup]')) closeFloating(); });

/* =========================================================================================
   Editor
   ========================================================================================= */
const blank = () => ({ slug: '', title: '', excerpt: '', category: '', keywords: [], date: today(), author: 'Latch Infinity', cover: '', coverAlt: '', cta: '', body: '', draft: true });

function openEditor(slug) {
  const saved = slug ? data.posts.find(p => p.slug === slug) : null;
  if (slug && !saved) { toast('That article was not found.', { err: true }); location.hash = ''; return; }
  const local = store.get(localKey(slug));
  pending = {};
  if (local && local.pending) for (const [k, v] of Object.entries(local.pending)) pending[k] = { ...v, url: 'data:image/webp;base64,' + v.b64 };
  ed = { orig: slug || null, saved, post: local ? local.post : saved ? structuredClone(saved) : blank(), local: !!local, slugTouched: !!slug };
  drawEditor();
  if (!slug && !local) $('#title').focus();
}

function drawEditor() {
  const p = ed.post;
  document.title = (p.title || 'New article') + ' · Blog Studio';
  $('#app').innerHTML = `
  ${topbar(`<a class="icon-btn" href="#" aria-label="Back to articles">${I.back}</a>
    <div class="status" id="status" aria-live="polite"></div><span class="grow"></span>
    <button class="icon-btn" type="button" id="b-details" aria-label="Article settings" title="Article settings">${I.sliders}</button>
    <button class="icon-btn" type="button" id="b-more" aria-label="More" aria-haspopup="menu" aria-expanded="false">${I.more}</button>
    <button class="btn btn-primary" type="button" id="b-pub"></button>`)}
  <main class="canvas" id="canvas">
    <div class="cover" id="cover"></div>
    <textarea class="t-title" id="title" rows="1" placeholder="Title" aria-label="Title">${esc(p.title)}</textarea>
    <textarea class="t-sum" id="excerpt" rows="1" placeholder="Add a one-line summary" aria-label="Summary">${esc(p.excerpt)}</textarea>
    <div class="byline" id="byline"></div>
    <div class="rule"></div>
    <div class="prose" id="body" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Article" spellcheck="true" data-ph="Start writing…"></div>
    <div class="ending"><span class="lab">Closing note <span style="text-transform:none;letter-spacing:0;font-stretch:100%;opacity:.7">· optional</span></span>
      <textarea id="cta" rows="1" placeholder="A line inviting readers to work with you. Shown with a Let's Talk button.">${esc(p.cta || '')}</textarea></div>
    <button class="plus" id="plus" type="button" aria-label="Insert" aria-haspopup="menu" aria-expanded="false" hidden>${I.plus}</button>
  </main>`;
  drawCover(); drawByline(); loadBody(p.body); refreshStatus();
  ['title', 'excerpt', 'cta'].forEach(id => { const t = $('#' + id); grow(t); t.addEventListener('input', () => { grow(t); fromFields(); }); });
  $('#title').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#excerpt').focus(); } });
  $('#excerpt').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); focusBodyStart(); } });
  $('#b-details').onclick = () => sheet('details');
  $('#b-pub').onclick = publish;
  $('#b-more').onclick = e => moreMenu(e.currentTarget);
  bindBody(); scrollTo(0, 0); scrollLine();
}
const grow = t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; };
addEventListener('resize', () => $$('.t-title, .t-sum, #cta').forEach(grow));

function refreshStatus() {
  if (!ed) return;
  const p = ed.post, s = $('#status'), b = $('#b-pub');
  const live = ed.saved && !ed.saved.draft, changed = ed.local;
  const [dot, text] = busy ? ['busy', 'Publishing…'] : !ed.saved ? ['draft', changed ? 'Draft · saved on this device' : 'New draft'] : live ? ['live', changed ? 'Published · unpublished changes' : 'Published'] : ['draft', changed ? 'Draft · unsaved changes' : 'Draft'];
  s.innerHTML = `<span class="dot ${dot}"></span><span>${text}</span>`;
  b.textContent = busy ? 'Publishing…' : live ? 'Update' : 'Publish';
  b.disabled = busy || (live && !changed);
}
function drawByline() {
  const p = ed.post, n = words(p.body);
  $('#byline').innerHTML = `<button type="button" data-open="category" class="${p.category ? '' : 'missing'}">${esc(p.category || 'Choose category')}</button>
    <span>${fmtDate(p.date)}</span><span>·</span><span>${Math.max(1, Math.round(n / 220))} min read</span>`;
  $('#byline [data-open]').onclick = () => sheet('details', 'category');
}
function drawCover() {
  const p = ed.post, c = $('#cover');
  c.className = 'cover' + (p.cover ? ' has' : '');
  c.innerHTML = p.cover ? `<img src="${esc(src(p.cover))}" alt=""><div class="tools"><button type="button" data-c="replace">Replace</button><button type="button" data-c="remove">Remove</button></div>`
    : `<button class="cover-add" type="button" data-c="replace">${I.image} Add cover image</button>`;
  c.onclick = e => {
    const a = e.target.closest('[data-c]'); if (!a) return;
    if (a.dataset.c === 'remove') { p.cover = ''; drawCover(); changed(); toast('Cover removed.', { action: ['Undo', () => { p.cover = c._last; drawCover(); changed(); }] }); return; }
    pick(f => setCover(f));
  };
  if (p.cover) c._last = p.cover;
  if (matchMedia('(hover: none)').matches) c.classList.add('touch');
}
function pick(cb) { const f = $('#pick'); f.value = ''; f.onchange = () => f.files[0] && cb(f.files[0]); f.click(); }

/* Images are resized and turned into WebP in the browser, like the rest of the site's images. */
async function toWebp(file, maxW) {

  const blk = blockOf(r.startContainer), tag = blk ? blk.tagName : '', a = r.startContainer.parentElement?.closest('a');
  const on = c => { try { return document.queryCommandState(c); } catch (e) { return false; } };
  bb.innerHTML = `<button type="button" data-b="bold" class="${on('bold') ? 'on' : ''}" aria-label="Bold"><b>B</b></button>
    <button type="button" data-b="italic" class="${on('italic') ? 'on' : ''}" aria-label="Italic"><i style="font-family:Georgia,serif">i</i></button>
    <button type="button" data-b="link" class="${a ? 'on' : ''}" aria-label="Link">${I.link}</button><span class="sep"></span>
    <button type="button" data-b="h2" class="${tag === 'H2' ? 'on' : ''}" aria-label="Heading" style="font-stretch:125%">H</button>
    <button type="button" data-b="h3" class="${tag === 'H3' ? 'on' : ''}" aria-label="Subheading" style="font-size:12px;font-stretch:125%">H</button>
    <button type="button" data-b="quote" class="${tag === 'BLOCKQUOTE' ? 'on' : ''}" aria-label="Quote">${I.quote}</button>`;
  bb.onclick = e => {
    const b = e.target.closest('[data-b]'); if (!b) return;
    const c = b.dataset.b, cur = curBlock()?.tagName;
    if (c === 'bold' || c === 'italic') exec(c);
    if (c === 'h2' || c === 'h3') exec('formatBlock', cur === c.toUpperCase() ? 'p' : c);
    if (c === 'quote') exec('formatBlock', cur === 'BLOCKQUOTE' ? 'p' : 'blockquote');
    if (c === 'link') return linkMode();
    changed(); showBubble();
  };
  placeBubble(bb, rect);
}
function placeBubble(bb, rect) {
  const touch = matchMedia('(hover: none)').matches, w = bb.offsetWidth, h = bb.offsetHeight;
  let top = touch ? rect.bottom + 12 : rect.top - h - 10; if (top < 72) top = rect.bottom + 10;
  bb.style.top = Math.min(top, innerHeight - h - 8) + 'px';
  bb.style.left = Math.max(8, Math.min(rect.left + rect.width / 2 - w / 2, innerWidth - w - 8)) + 'px';
}
function linkMode() {
  const s = sel(); if (!s.rangeCount || !inBody()) return;
  const range = s.getRangeAt(0).cloneRange(), a = range.startContainer.parentElement?.closest('a');
  if (s.isCollapsed && !a) { toast('Select the words you want to link first.'); return; }
  let bb = $('.bubble'); if (!bb) { showBubble(); bb = $('.bubble'); } if (!bb) return;
  const rect = range.getBoundingClientRect();
  bb.innerHTML = `<input type="url" placeholder="Paste a link and press Enter" value="${esc(a ? a.getAttribute('href') : '')}" aria-label="Link address">${a ? `<button type="button" data-l="rm" aria-label="Remove link">${I.x}</button>` : ''}`;
  placeBubble(bb, rect);
  const inp = $('input', bb); inp.focus(); inp.select();
  const done = apply => {
    const s2 = sel(); s2.removeAllRanges(); s2.addRange(range); $('#body').focus();
    if (apply === 'rm') { if (a) { const rr = document.createRange(); rr.selectNodeContents(a); s2.removeAllRanges(); s2.addRange(rr); } exec('unlink'); }
    else if (apply) { let u = inp.value.trim(); if (u && !/^(https?:|mailto:|tel:|#|\/)/i.test(u)) u = (/^[^\s@]+@[^\s@]+$/.test(u) ? 'mailto:' : 'https://') + u; if (u) { if (a) a.setAttribute('href', u); else exec('createLink', u); } }
    bb.remove(); changed();
  };
  inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); done(true); } if (e.key === 'Escape') { e.preventDefault(); done(false); } };
  inp.onblur = () => setTimeout(() => bb.isConnected && bb.remove(), 150);
  const rm = $('[data-l="rm"]', bb); if (rm) rm.onmousedown = e => { e.preventDefault(); done('rm'); };
}

/* =========================================================================================
   Settings sheet: the same panel is used for article settings and for the first publish.
   ========================================================================================= */
function checks() {
  const p = ed.post;
  return [
    ['title', 'Title', !!p.title, true], ['excerpt', 'One-line summary', !!p.excerpt, true], ['category', 'Category', !!p.category, true],
    ['body', 'Article text', words(p.body) >= 20, true], ['cover', 'Cover image', !!p.cover, false],
  ];
}
function sheet(mode, focus) {
  flushLocal(); closeSheet();
  const p = ed.post, publishing = mode === 'publish';
  const scrim = document.createElement('div'); scrim.className = 'scrim'; scrim.onclick = closeSheet;
  const sh = document.createElement('aside'); sh.className = 'sheet'; sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-modal', 'true'); sh.setAttribute('aria-labelledby', 'sh-h');
  const allKw = [...new Set(data.posts.flatMap(x => x.keywords || []))];
  sh.innerHTML = `
    <div class="sheet-head"><h2 id="sh-h">${publishing ? 'Ready to publish?' : 'Article settings'}</h2><button class="icon-btn" type="button" data-x aria-label="Close">${I.x}</button></div>
    <div class="sheet-body">
      ${publishing ? `<div class="checks" id="checks"></div>` : ''}
      <div class="fld"><span class="lb" id="lb-cat">Category</span><div class="chips" role="group" aria-labelledby="lb-cat" id="cats"></div></div>
      <div class="fld"><span class="lb">Topics <i>Helps readers find related articles</i></span>
        <div class="tokens" id="toks"><input id="tok-in" placeholder="Add a topic" aria-label="Add a topic"></div><div class="sugg" id="sugg"></div></div>
      <div class="fld"><label for="slug">Web address</label><div class="url"><span>…/blog/</span><input id="slug" value="${esc(p.slug)}" spellcheck="false"></div>
        <small id="slug-note">${ed.saved && !ed.saved.draft ? 'Changing this breaks links people have already shared.' : 'Made from the title. Short and plain works best.'}</small></div>
      <div class="fld" style="grid-template-columns:1fr 1fr;column-gap:12px"><label for="date" style="grid-column:1">Date</label><label for="author" style="grid-column:2;grid-row:1">Author</label>
        <input class="inp" type="date" id="date" value="${esc(p.date || today())}"><input class="inp" id="author" value="${esc(p.author || 'Latch Infinity')}"></div>
      ${p.cover ? `<div class="fld"><label for="alt">Describe the cover <i>For screen readers</i></label><input class="inp" id="alt" value="${esc(p.coverAlt || '')}" placeholder="What the picture shows"></div>` : ''}
    </div>
    <div class="sheet-foot">${publishing ? `<button class="btn btn-line" type="button" id="sh-draft">Save as draft</button><button class="btn btn-primary" type="button" id="sh-go">Publish now</button>` : `<button class="btn btn-primary" type="button" data-x>Done</button>`}</div>`;
  document.body.append(scrim, sh);
  const sync = () => {
    p.slug = slugify($('#slug', sh).value) || p.slug; p.date = $('#date', sh).value || today(); p.author = $('#author', sh).value.trim() || 'Latch Infinity';
    if ($('#alt', sh)) p.coverAlt = $('#alt', sh).value.trim();
    changed(); drawByline(); if (publishing) drawChecks();
  };
  // categories
  const drawCats = () => {
    $('#cats', sh).innerHTML = cats().concat(p.category && !cats().includes(p.category) ? [p.category] : []).map(c => `<button type="button" class="chip" aria-pressed="${c === p.category}" data-cat="${esc(c)}">${esc(c)}</button>`).join('') + `<button type="button" class="chip add" id="cat-new">${I.plus} New</button>`;
    $$('[data-cat]', sh).forEach(b => b.onclick = () => { p.category = b.dataset.cat; drawCats(); sync(); });
    $('#cat-new', sh).onclick = e => {
      const b = e.currentTarget; b.outerHTML = `<span class="chip add"><input id="cat-in" placeholder="Category name" aria-label="New category"></span>`;
      const i = $('#cat-in', sh); i.focus();
      const ok = () => { const v = i.value.trim(); if (v) { if (!data.categories.includes(v)) data.categories.push(v); p.category = v; sync(); } drawCats(); };
      i.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); ok(); } if (ev.key === 'Escape') drawCats(); }; i.onblur = ok;
    };
  };
  // topics
  const drawToks = () => {
    const box = $('#toks', sh), input = $('#tok-in', sh);
    $$('.tok', box).forEach(t => t.remove());
    (p.keywords || []).forEach((k, i) => { const t = document.createElement('span'); t.className = 'tok'; t.innerHTML = `${esc(k)}<button type="button" aria-label="Remove ${esc(k)}">${I.x}</button>`; t.querySelector('button').onclick = () => { p.keywords.splice(i, 1); drawToks(); sync(); }; box.insertBefore(t, input); });
    const q = input.value.trim().toLowerCase();
    $('#sugg', sh).innerHTML = allKw.filter(k => !(p.keywords || []).includes(k) && (!q || k.toLowerCase().includes(q))).slice(0, q ? 8 : 6).map(k => `<button type="button">+ ${esc(k)}</button>`).join('');
    $$('#sugg button', sh).forEach(b => b.onclick = () => { add(b.textContent.slice(2)); input.focus(); });
  };
  const add = v => { v = v.replace(/,/g, '').trim(); if (v && !(p.keywords ||= []).includes(v)) p.keywords.push(v); $('#tok-in', sh).value = ''; drawToks(); sync(); };
  const ti = $('#tok-in', sh);
  ti.onkeydown = e => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); add(ti.value); } if (e.key === 'Backspace' && !ti.value && p.keywords?.length) { p.keywords.pop(); drawToks(); sync(); } };
  ti.oninput = drawToks; ti.onblur = () => ti.value.trim() && add(ti.value);
  $('#toks', sh).onclick = e => e.target === e.currentTarget && ti.focus();
  $('#slug', sh).oninput = () => { ed.slugTouched = true; };
  $('#slug', sh).onchange = sync; $('#date', sh).onchange = sync; $('#author', sh).onchange = sync; $('#alt', sh)?.addEventListener('change', sync);
  $$('[data-x]', sh).forEach(b => b.onclick = closeSheet);
  sh.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  // publishing checklist
  const drawChecks = () => {
    const box = $('#checks', sh); if (!box) return;
    const list = checks();
    box.innerHTML = list.map(([k, t, ok, req]) => `<button type="button" class="check ${ok ? 'ok' : req ? 'no' : 'opt'}" data-k="${k}"><span class="st">${ok ? I.check : ''}</span><span>${t}</span><i>${ok ? '' : req ? 'Needed' : 'Recommended'}</i></button>`).join('');
    $$('[data-k]', box).forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      if (k === 'category') return $('#cats button', sh)?.focus();
      closeSheet();
      if (k === 'cover') { if (!p.cover) pick(setCover); return; }
      if (k === 'body') return focusBodyStart();
      const el = $('#' + k); el.focus(); el.scrollIntoView({ block: 'center' });
    });
    $('#sh-go', sh).disabled = list.some(([, , ok, req]) => req && !ok);
  };
  drawCats(); drawToks(); drawChecks();
  if (publishing) { $('#sh-go', sh).onclick = () => { sync(); closeSheet(); save(false); }; $('#sh-draft', sh).onclick = () => { sync(); closeSheet(); save(true); }; }
  (focus === 'category' ? $('#cats button', sh) : $('[data-x]', sh))?.focus();
}
function closeSheet() { $$('.sheet, .scrim').forEach(x => x.remove()); }

/* ---------- publish / draft / delete ---------- */
function publish() {
  flushLocal();
  const live = ed.saved && !ed.saved.draft;
  if (live && checks().every(([, , ok, req]) => ok || !req)) return save(false);
  sheet('publish');
}
function needConnection(then) {
  if (online) return false;
  connectDialog.then = then; connectDialog();
  return true;
}
async function save(asDraft) {
  if (busy || !ed) return;
  flushLocal();
  const p = ed.post;
  if (!p.title) { toast('Give the article a title first.', { err: true }); $('#title').focus(); return; }
  if (!p.slug) p.slug = slugify(p.title);
  if (needConnection(() => save(asDraft))) return;
  const was = ed.orig, post = { ...p, draft: !!asDraft };
  busy = true; refreshStatus();
  try {
    await commit(d => {
      d.posts = d.posts || [];
      if (d.posts.some(x => x.slug === post.slug && x.slug !== was)) throw new Error('Another article already uses this web address. Change it in Article settings.');
      const i = was ? d.posts.findIndex(x => x.slug === was) : -1;
      if (i >= 0) d.posts[i] = post; else d.posts.unshift(post);
      d.categories = d.categories || []; if (post.category && !d.categories.includes(post.category)) d.categories.push(post.category);
      return d;
    }, `${asDraft ? 'Save draft' : was && ed.saved && !ed.saved.draft ? 'Update article' : 'Publish article'}: ${post.title}`);
    store.del(localKey(was));
    ed.orig = post.slug; ed.saved = structuredClone(post); ed.post = structuredClone(post); ed.local = false; ed.slugTouched = true;
    history.replaceState(null, '', '#edit/' + encodeURIComponent(post.slug));
    busy = false; refreshStatus();
    if (asDraft) toast('Draft saved. Only you can see it here.');
    else toast('Published. The article is live in about a minute.', { ms: 8000, action: ['View', () => open('index.html#blog/' + encodeURIComponent(post.slug), '_blank', 'noopener')] });
  } catch (e) { busy = false; refreshStatus(); toast(esc(e.message), { err: true, ms: 8000 }); }
}
function moreMenu(anchor) {
  const live = ed.saved && !ed.saved.draft;
  menu(anchor, [
    ['', `${I.sliders.replace(/18/g, 16)} Article settings`, () => sheet('details')],
    live && ['', `${I.ext} View on the site`, 'index.html#blog/' + encodeURIComponent(ed.saved.slug)],
    ed.saved && !live ? ['', `${I.draft} Save draft`, () => save(true)] : !ed.saved ? ['', `${I.draft} Save as draft`, () => save(true)] : null,
    live && ['', `${I.draft} Unpublish <small>Move to drafts</small>`, async () => { if (await ask({ title: 'Unpublish this article?', text: 'It disappears from the website and waits in your drafts.', ok: 'Unpublish' })) save(true); }],
    ed.local && ed.saved && ['', `${I.undo} Discard changes`, async () => { if (await ask({ title: 'Discard your changes?', text: 'The article goes back to the last version you published or saved.', ok: 'Discard', danger: true })) { store.del(localKey(ed.orig)); openEditor(ed.orig); } }],
    '-',
    ed.saved ? ['danger', `${I.trash} Delete article`, remove] : ['danger', `${I.trash} Delete this draft`, async () => { if (await ask({ title: 'Delete this draft?', text: 'It has not been published, so it only exists on this device.', ok: 'Delete', danger: true })) { store.del(localKey(null)); ed = null; location.hash = ''; } }],
  ]);
}
async function remove() {
  const p = ed.saved;
  if (!await ask({ title: 'Delete this article?', text: `“${esc(p.title)}” is removed from the website. Earlier versions stay in the GitHub history.`, ok: 'Delete', danger: true })) return;
  if (needConnection(remove)) return;
  busy = true; refreshStatus();
  try {
    await commit(d => { d.posts = (d.posts || []).filter(x => x.slug !== ed.orig); return d; }, `Delete article: ${p.title}`);
    store.del(localKey(ed.orig)); busy = false; ed = null; location.hash = ''; toast('Article deleted.');
  } catch (e) { busy = false; refreshStatus(); toast(esc(e.message), { err: true, ms: 8000 }); }
}

document.addEventListener('keydown', e => {
  if (!ed) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); ed.saved && !ed.saved.draft ? publish() : (flushLocal(), toast('Saved on this device. Publish when you are ready.')); }
});

window.__studio = { toMd, toHtml };   // used by the automated round-trip check
load().then(route);
})();
</script>
